[package]
name = "speedy-core"
version = "0.1.0"
edition = "2024"
description = "Speedy's host-side core: claude actors, PTYs, files, git, worktrees and state, with no Tauri dependency"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
portable-pty = "0.9.0"
similar = "3.2.0"
ignore = "0.4.33"
anyhow = "1.0.104"
dirs = "7.0.0"
parking_lot = "0.12.5"
log = "0.4.34"
libc = "0.2.190"
nucleo-matcher = "0.3.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
